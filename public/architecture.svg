<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background: #141312; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2886A" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A" />
      <stop offset="100%" stop-color="#181615" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2886A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4A9C76" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2886A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid Lines -->
  <g stroke="#262320" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="275" y1="0" x2="275" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="725" y1="0" x2="725" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Step 1: Client Environment -->
  <g transform="translate(60, 50)">
    <rect width="240" height="260" rx="10" fill="url(#cardGrad)" stroke="#332F2B" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#24211E" />
    <circle cx="20" cy="21" r="5" fill="#E2886A" />
    <text x="36" y="26" fill="#EDE7F3" font-size="13" font-weight="700" letter-spacing="0.5">1. CLIENT ATTESTATION</text>
    
    <text x="20" y="75" fill="#C5BFAB" font-size="12" font-weight="600">Dynamic Heuristics</text>
    <rect x="20" y="85" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="102" fill="#9C93AD" font-size="11" font-family="monospace">Biometric Jerk (d³x/dt³)</text>

    <text x="20" y="135" fill="#C5BFAB" font-size="12" font-weight="600">Tamper &amp; Proxy Probes</text>
    <rect x="20" y="145" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="162" fill="#9C93AD" font-size="11" font-family="monospace">Object.getOwnPropertyDescriptor</text>

    <text x="20" y="195" fill="#C5BFAB" font-size="12" font-weight="600">Hardware Bound State</text>
    <rect x="20" y="205" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="222" fill="#9C93AD" font-size="11" font-family="monospace">AudioContext &amp; WebGL Fingerprint</text>

    <rect x="20" y="246" width="200" height="4" rx="2" fill="#E2886A" opacity="0.4" />
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(300, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="76,-4 86,0 76,4" fill="#E2886A" />
    <text x="40" y="-12" fill="#E2886A" font-size="10" font-weight="700" text-anchor="middle">CHALLENGE</text>
  </g>

  <!-- Step 2: Micro Proof-of-Work -->
  <g transform="translate(380, 50)">
    <rect width="240" height="260" rx="10" fill="url(#cardGrad)" stroke="#332F2B" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#24211E" />
    <circle cx="20" cy="21" r="5" fill="#E5AC6B" />
    <text x="36" y="26" fill="#EDE7F3" font-size="13" font-weight="700" letter-spacing="0.5">2. CRYPTOGRAPHIC PoW</text>

    <text x="20" y="75" fill="#C5BFAB" font-size="12" font-weight="600">Ephemeral Micro-Puzzle</text>
    <rect x="20" y="85" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="102" fill="#E5AC6B" font-size="11" font-family="monospace">SHA-256(seed + nonce)</text>

    <text x="20" y="135" fill="#C5BFAB" font-size="12" font-weight="600">Client Compute Budget</text>
    <rect x="20" y="145" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="162" fill="#9C93AD" font-size="11" font-family="monospace">~15ms Web Crypto Worker</text>

    <text x="20" y="195" fill="#C5BFAB" font-size="12" font-weight="600">Botnet Cost Barrier</text>
    <rect x="20" y="205" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="222" fill="#63B58E" font-size="11" font-family="monospace">Zero Free Headless Floods</text>

    <rect x="20" y="246" width="200" height="4" rx="2" fill="#E5AC6B" opacity="0.4" />
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(620, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="76,-4 86,0 76,4" fill="#63B58E" />
    <text x="40" y="-12" fill="#63B58E" font-size="10" font-weight="700" text-anchor="middle">ATTESTED</text>
  </g>

  <!-- Step 3: Zero-Dependency Server Gate -->
  <g transform="translate(700, 50)">
    <rect width="240" height="260" rx="10" fill="url(#cardGrad)" stroke="#332F2B" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#24211E" />
    <circle cx="20" cy="21" r="5" fill="#63B58E" />
    <text x="36" y="26" fill="#EDE7F3" font-size="13" font-weight="700" letter-spacing="0.5">3. ZERO-DEP BACKEND GATE</text>

    <text x="20" y="75" fill="#C5BFAB" font-size="12" font-weight="600">HMAC-SHA256 Verification</text>
    <rect x="20" y="85" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="102" fill="#63B58E" font-size="11" font-family="monospace">&lt;1ms Verification Latency</text>

    <text x="20" y="135" fill="#C5BFAB" font-size="12" font-weight="600">Atomic Replay Lock</text>
    <rect x="20" y="145" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="162" fill="#9C93AD" font-size="11" font-family="monospace">Single-Use Token Burn</text>

    <text x="20" y="195" fill="#C5BFAB" font-size="12" font-weight="600">Deterministic Verdict</text>
    <rect x="20" y="205" width="200" height="26" rx="4" fill="#141312" stroke="#2B2825" />
    <text x="28" y="222" fill="#EDE7F3" font-size="11" font-family="monospace">{ verdict: 'accept', risk: 0 }</text>

    <rect x="20" y="246" width="200" height="4" rx="2" fill="#63B58E" opacity="0.4" />
  </g>
</svg>
