<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2886A" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDD7CF" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE0D6" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E2886A" />
      <stop offset="100%" stop-color="#C85A32" />
    </radialGradient>
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (Deep Obsidian) -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#0D0C0B" stroke="#2C2825" stroke-width="1.5" />

  <!-- Diagonal 'X' Crosshair Rays -->
  <line x1="13.5" y1="13.5" x2="50.5" y2="50.5" stroke="url(#terracottaGrad)" stroke-width="3.6" stroke-linecap="round" opacity="0.95" />
  <line x1="13.5" y1="50.5" x2="50.5" y2="13.5" stroke="url(#terracottaGrad)" stroke-width="3.6" stroke-linecap="round" opacity="0.95" />

  <!-- Protective Moat around center -->
  <circle cx="32" cy="32" r="16" fill="#0D0C0B" />

  <!-- Precision Attestation 'O' Ring -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="url(#ringGrad)" stroke-width="3.2" />

  <!-- Cardinal Radar Reticle Ticks -->
  <line x1="32" y1="9.5" x2="32" y2="12.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="51.5" x2="32" y2="54.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="9.5" y1="32" x2="12.5" y2="32" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="51.5" y1="32" x2="54.5" y2="32" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Glowing Terracotta Core Dot (Signature Brand Emblem) -->
  <circle cx="32" cy="32" r="6.6" fill="url(#coreGlow)" filter="url(#subtleGlow)" />
  <circle cx="32" cy="32" r="2.0" fill="#FFF5F0" />
</svg>
